# Workflow profile (snakemake 7.x). Applied via --workflow-profile in run.sh.
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30

use-conda: True
conda-frontend: mamba

# Per-rule resources. The germline step merges per-donor VCFs across the whole
# cohort with bcftools -- the heavy, parallel step; the R aggregations are light.
set-resources:
  germline_cohort_vcf:
    mem: "32GB"
    runtime: 360
default-resources:
  mem: "8GB"
  runtime: 120
